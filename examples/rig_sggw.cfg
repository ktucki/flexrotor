# FlexRotor rig and rotor description: soil bin of the Warsaw University of Life Sciences - SGGW,
# power harrow rotor with a compliantly mounted tine disc (Gruz 2026). These are the built-in
# defaults; copy this file and change the values for another logger, rotor or coupling.

# logger channels (0-based columns of the CSV records) and scaling
col_t = 0
col_shaft = 1
col_disc = 2
col_cart = 3
col_torque = 4
col_speed = 5
counts_per_rev = 4096        # encoder counts per revolution
torque_scale = -0.1          # N*m per raw unit
speed_scale = 0.1            # rpm per raw unit
cart_counts_per_m = 51300    # carriage encoder counts per metre
dt_nominal = 0.002           # s, logger period

# drive-train loss torque in air, Ms = loss_c0 + loss_c1*w + loss_c2*w^2 (N*m, w in rad/s)
loss_c0 = 10.72
loss_c1 = 0.6325
loss_c2 = -0.0106

# signal processing and soil phase
lowpass_hz = 1.5             # zero-phase 4th-order Butterworth
phase_angle_deg = 1.0        # 'angle' convention: in soil while alpha > threshold
phase_speed = 0.058          # 'travel' convention: carriage speed threshold, m/s
phase_trim = 0.2             # 'travel' convention: fraction trimmed at each end

# disc and coupling
J = 0.023                    # kg*m^2, disc with tines
amax = 90                    # deg, rotation range between the stops
ko = 10000                   # N*m/rad, end-stop contact stiffness
muo = 20                     # N*m*s/rad, end-stop contact damping
v0 = 0.05                    # rad/s, friction regularisation velocity

# rotor geometry
z = 2                        # tines per disc
radius = 0.11                # m
depth = 0.14                 # m, working depth
width = 0.25                 # m, working width
spacing = 0.217              # m, axis distance of adjacent rotors: working width 1.3 m / 6 rotors of the tested harrow
phase_deg = 0                # deg, tine phase offset of adjacent rotors (0: 180/z, i.e. 90 deg for two tines)
load_corr = 0                # correlation of the slow soil loads of adjacent rotors (0: independent)

# coupling spring of setting N2 (prototype, Gruz 2026, Table 14: spring no. 4) and design limits
spring_d = 5.0               # mm, wire diameter
spring_D = 46.5              # mm, mean coil diameter
spring_n = 5.5               # active coils
spring_E = 206000            # N/mm^2
spring_Rm = 0                # N/mm^2 (0: EN 10270-1 SH/DH minimum for the wire diameter)
stress_factor = 0.7          # permissible static bending stress / Rm (EN 13906-3)
fatigue_r6 = 0.50            # strength of a repeated bending stress / Rm, 1e6 cycles (torsion springs, patented wire, not shot peened)
fatigue_r5 = 0.53            # the same, 1e5 cycles
Di_min = 37.7                # mm, inner diameter at the end stop: that of the prototype spring on the 35 mm arbor
Do_max = 70                  # mm, outer diameter: pin circle 80 mm of the adjustment disc minus the 10 mm pin
L_max = 40                   # mm, body length: axial space of the prototype spring (assembly drawing)
